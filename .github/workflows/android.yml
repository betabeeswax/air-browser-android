name: Build AIR Browser for Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-browser-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      AIR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/AIR-Browser-Android.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Browser-Android-APK
          path: artifacts/AIR-Browser-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-android-build-${{ github.run_number }}
          name: AIR Browser Android build ${{ github.run_number }}
          body: |
            Early testing build of AIR Browser for Android.
            - APK: AIR-Browser-Android.apk
            - Built from commit ${{ github.sha }}
            - Debug APK for sideload testing; not a Play Store release.
          files: artifacts/AIR-Browser-Android.apk
          make_latest: false
