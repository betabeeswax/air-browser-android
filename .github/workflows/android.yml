name: Build AIR Browser for Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-browser-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      AIR_BUILD_NUMBER: ${{ github.run_number }}
      AIR_SIGNING_KEYSTORE: app/air-release.jks
      AIR_SIGNING_STORE_PASSWORD: ${{ secrets.AIR_SIGNING_STORE_PASSWORD }}
      AIR_SIGNING_KEY_ALIAS: ${{ secrets.AIR_SIGNING_KEY_ALIAS }}
      AIR_SIGNING_KEY_PASSWORD: ${{ secrets.AIR_SIGNING_KEY_PASSWORD }}
      AIR_SIGNING_KEYSTORE_BASE64: ${{ secrets.AIR_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed release APK when signing key is configured
        if: env.AIR_SIGNING_KEYSTORE_BASE64 != '' && env.AIR_SIGNING_STORE_PASSWORD != '' && env.AIR_SIGNING_KEY_ALIAS != '' && env.AIR_SIGNING_KEY_PASSWORD != ''
        run: |
          echo "$AIR_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$AIR_SIGNING_KEYSTORE"
          gradle --no-daemon :app:assembleRelease

      - name: Build debug APK when no signing key is configured
        if: env.AIR_SIGNING_KEYSTORE_BASE64 == '' || env.AIR_SIGNING_STORE_PASSWORD == '' || env.AIR_SIGNING_KEY_ALIAS == '' || env.AIR_SIGNING_KEY_PASSWORD == ''
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/AIR-Browser-Android.apk
            echo "APK_SIGNING=release" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/AIR-Browser-Android.apk
            echo "APK_SIGNING=debug (temporary; configure signing secrets)" >> "$GITHUB_ENV"
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Browser-Android-APK
          path: artifacts/AIR-Browser-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-android-build-${{ github.run_number }}
          name: AIR Browser Android build ${{ github.run_number }}
          body: |
            Early testing build of AIR Browser for Android.
            - APK: AIR-Browser-Android.apk
            - Built from commit ${{ github.sha }}
            - Signing mode: ${{ env.APK_SIGNING }}
            - Configure AIR_SIGNING_KEYSTORE_BASE64, AIR_SIGNING_STORE_PASSWORD, AIR_SIGNING_KEY_ALIAS, and AIR_SIGNING_KEY_PASSWORD repository secrets for stable signed updates.
            - Not a Play Store release.
          files: artifacts/AIR-Browser-Android.apk
          make_latest: false
